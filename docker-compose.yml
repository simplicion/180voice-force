version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: voiceforce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voiceforce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceforce_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-180voiceforce_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - voiceforce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceforce} -d ${POSTGRES_DB:-180voiceforce_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voiceforce_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - voiceforce_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  voiceforce_pgdata:
    name: voiceforce_pgdata
  voiceforce_redisdata:
    name: voiceforce_redisdata
