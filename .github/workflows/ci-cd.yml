name: Voice Force Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ====================================================
  # Phase 1: Lint, Typecheck, & Build All Monorepo Packages
  # ====================================================
  build-and-test:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Voiceforce Prisma Client
        run: pnpm run db:generate

      - name: Run Full Monorepo Build (Turbo)
        run: pnpm turbo run build

  # ====================================================
  # Phase 2: Deploy Frontend to Cloudflare Pages
  # Domain: voiceforce.vanityworkspace.com
  # ====================================================
  deploy-frontend-cloudflare:
    name: Deploy Voice Force Web to Cloudflare Pages
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Database Client
        run: pnpm run db:generate

      - name: Build Voiceforce Frontend for Production Export
        env:
          NEXT_EXPORT: 'true'
          CF_PAGES: 'true'
          NEXT_PUBLIC_180_AUTH_URL: https://auth.vanityworkspace.com
          NEXT_PUBLIC_180_CLIENT_ID: ${{ secrets.VOICEFORCE_180_CLIENT_ID }}
          NEXT_PUBLIC_API_URL: https://api.voiceforce.vanityworkspace.com
        run: pnpm turbo run build --filter=@workspace/voiceforce-frontend...

      - name: Ensure Cloudflare Pages Project Exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages project create voiceforce --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/voiceforce-frontend/out --project-name=voiceforce --branch=main --commit-dirty=true

  # ====================================================
  # Phase 3: Docker Build Verification for Dedicated Backend
  # ====================================================
  verify-backend-container:
    name: Verify Backend Docker Build
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t voiceforce-backend:latest -f apps/voiceforce-backend/Dockerfile . || true
